info:
  name: Get all movies with start year before 1888
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/v1/movies?startYear=1800&endYear=2000"
  params:
    - name: startYear
      value: "1800"
      type: query
    - name: endYear
      value: "2000"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
